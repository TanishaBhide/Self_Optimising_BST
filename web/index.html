<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BST Optimization Visualizer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>Frequency-Aware Self-Optimizing Tree</h1>
    <p>Compare standard BST search paths against a dynamic frequency-optimized tree.</p>
  </header>

  <div class="status" id="statusBar">
    Ready. Insert names to build the trees.
  </div>

  <section class="controls">
    <input type="text" id="keyInput" placeholder="Enter Name (e.g. Alice)" autocomplete="off" />
    <button class="btn primary" id="insertBtn">Insert</button>
    <button class="btn primary" id="searchBtn">Search</button>
    <button class="btn warning" id="deleteBtn">Delete</button>
    <button class="btn danger" id="finishBtn">Finish</button>
  </section>

  <section class="comparison">
    <div class="card" id="normalCard">
      <h2>Normal BST</h2>
      <div class="stats">
        <span>Avg Search Time:</span>
        <strong id="normalTime">0.000000 ms</strong>
      </div>
      <div class="tree-area">
        <svg id="normalTreeSVG" class="tree-svg"></svg>
      </div>
    </div>

    <div class="card" id="freqCard">
      <h2>Frequency-Aware BST</h2>
      <div class="stats">
        <span>Avg Search Time:</span>
        <strong id="freqTime">0.000000 ms</strong>
      </div>
      <div class="tree-area">
        <svg id="freqTreeSVG" class="tree-svg"></svg>
      </div>
    </div>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
