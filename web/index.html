<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Frequency-Aware Self-Optimising BST</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- HEADER -->
  <header>
    <h1>Frequency-Aware Self-Optimising BST</h1>
    <p>Contact Search: Normal BST vs Frequency-Aware BST</p>
  </header>

  <!-- STATUS BAR -->
  <div class="status" id="statusBar">
    Ready. Enter name like "mom", "dad", etc.
  </div>

  <!-- CONTROLS -->
  <section class="controls">
    <input type="text" id="keyInput" placeholder="Enter name (mom, dad, etc)" />
    
    <button class="btn primary" id="insertBtn">Insert</button>
    <button class="btn primary" id="searchBtn">Search</button>
    <button class="btn success" id="optimizeBtn">Optimize</button>
    <button class="btn warning" id="deleteBtn">Delete</button>
    <button class="btn danger" id="finishBtn">Finish</button>
  </section>

  <!-- COMPARISON -->
  <section class="comparison">
    <!-- NORMAL BST -->
    <div class="card" id="normalCard">
      <h2>Normal BST</h2>
      <div class="stats">
        <span>Search Time</span>
        <strong id="normalTime">0 ms</strong>
      </div>
      <div class="tree-area">
        <svg id="normalTreeSVG" class="tree-svg" viewBox="0 0 900 500"></svg>
      </div>
    </div>

    <!-- FREQUENCY BST -->
    <div class="card" id="freqCard">
      <h2>Frequency-Aware BST</h2>
      <div class="stats">
        <span>Search Time</span>
        <strong id="freqTime">0 ms</strong>
      </div>
      <div class="tree-area">
        <svg id="freqTreeSVG" class="tree-svg" viewBox="0 0 900 500"></svg>
      </div>
    </div>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
